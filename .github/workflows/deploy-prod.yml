name: Deploy → Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Docker image tag (SHA) to deploy
        required: true
        type: string

jobs:
  deploy-production:
    name: Deploy → Production
    runs-on: ubuntu-latest
    environment: production  # requires manual approval in GitHub Environments

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run (production)
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: kardex-backend
          region: ${{ secrets.GCP_REGION }}
          image: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/kardex/backend:${{ inputs.image_tag }}
          env_vars: |
            APP_URL=${{ secrets.PROD_APP_URL }}
            NODE_ENV=production
          secrets: |
            DATABASE_URL=kardex-prod-db-url:latest
            JWT_SECRET=kardex-jwt-secret:latest
          flags: |
            --min-instances=1
            --max-instances=10
            --memory=512Mi
            --cpu=1
            --add-cloudsql-instances=${{ secrets.CLOUD_SQL_INSTANCE }}
            --ingress=all
